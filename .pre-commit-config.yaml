repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Share CI's locked Python 3.11 checker environment (.venv-mypy), leaving the
  # Python 3.13 runtime .venv intact. The first run installs the dev group;
  # later runs reuse it. Dependencies come only from pyproject.toml / uv.lock,
  # and strictness and target Python remain in [tool.mypy]. See issue #179.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: bash scripts/typecheck.sh
        language: system
        types: [python]
        files: ^ontokit/
        pass_filenames: false
        require_serial: true
